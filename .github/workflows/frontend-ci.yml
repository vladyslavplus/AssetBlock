name: Frontend CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22.x"

      - name: Install pnpm
        run: npm install -g pnpm@11.13.0

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@v4
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        working-directory: asblock-frontend
        run: pnpm install --frozen-lockfile

      - name: Unit and component tests
        working-directory: asblock-frontend
        run: pnpm run test:coverage

      - name: Upload Vitest coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-vitest-coverage
          path: asblock-frontend/coverage
          if-no-files-found: ignore

      - name: Check
        working-directory: asblock-frontend
        run: pnpm run check

      - name: Build
        working-directory: asblock-frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:3999
          ASSETBLOCK_API_BASE_URL: http://127.0.0.1:3999
        run: pnpm run build

      - name: Install Playwright Chromium
        working-directory: asblock-frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Playwright smoke
        working-directory: asblock-frontend
        env:
          CI: true
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:3999
          ASSETBLOCK_API_BASE_URL: http://127.0.0.1:3999
        run: pnpm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: frontend-playwright-report
          path: |
            asblock-frontend/playwright-report
            asblock-frontend/test-results
          if-no-files-found: ignore
