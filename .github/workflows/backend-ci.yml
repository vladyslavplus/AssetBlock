name: Backend CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('asblock-backend/**/*.csproj', 'asblock-backend/Directory.Build.props', 'asblock-backend/Directory.Packages.props', 'asblock-backend/NuGet.config', 'asblock-backend/**/packages.lock.json', 'asblock-backend/global.json', 'asblock-backend/.config/dotnet-tools.json') }}
          restore-keys: nuget-

      - name: Restore
        working-directory: asblock-backend
        run: |
          dotnet restore asblock-backend.slnx --locked-mode
          dotnet tool restore

      - name: Verify formatting and code style
        working-directory: asblock-backend
        run: dotnet format asblock-backend.slnx --no-restore --verify-no-changes --verbosity minimal

      - name: Build
        working-directory: asblock-backend
        run: dotnet build asblock-backend.slnx --no-restore --configuration Release

      - name: Test & Collect Coverage
        working-directory: asblock-backend
        run: |
          mkdir -p artifacts/test-results
          # Unique TRX name per test project avoids collisions under a shared results directory.
          for csproj in \
            AssetBlock.Application.Tests/AssetBlock.Application.Tests.csproj \
            AssetBlock.Infrastructure.Tests/AssetBlock.Infrastructure.Tests.csproj \
            AssetBlock.Infrastructure.IntegrationTests/AssetBlock.Infrastructure.IntegrationTests.csproj \
            AssetBlock.WebApi.Tests/AssetBlock.WebApi.Tests.csproj \
            AssetBlock.WebApi.IntegrationTests/AssetBlock.WebApi.IntegrationTests.csproj
          do
            name="$(basename "$csproj" .csproj)"
            echo "::group::Test $name"
            dotnet test "$csproj" \
              --no-build \
              --configuration Release \
              --logger "console;verbosity=normal" \
              --logger "trx;LogFileName=${name}.trx" \
              --results-directory "${GITHUB_WORKSPACE}/asblock-backend/artifacts/test-results/${name}" \
              --collect:"XPlat Code Coverage"
            echo "::endgroup::"
          done

      - name: Merge coverage (Cobertura)
        if: success()
        working-directory: asblock-backend
        run: |
          mkdir -p artifacts/coverage-merged
          # Community ReportGenerator Cobertura merge (Apache-2.0); no PRO features required.
          # Input only raw per-project reports under test-results (merged output is separate).
          # Skip VSTest */In/* attachment copies so the same coverlet file is not merged twice.
          mapfile -t reports < <(
            find artifacts/test-results -type f -name 'coverage.cobertura.xml' ! -path '*/In/*' | sort
          )
          if [ "${#reports[@]}" -eq 0 ]; then
            echo "No raw coverage.cobertura.xml files found to merge."
            exit 1
          fi
          printf -v report_arg '%s;' "${reports[@]}"
          report_arg="${report_arg%;}"
          echo "Merging ${#reports[@]} Cobertura report(s)"
          dotnet tool run reportgenerator -- \
            "-reports:${report_arg}" \
            "-targetdir:artifacts/coverage-merged" \
            "-reporttypes:Cobertura" \
            "-title:AssetBlock Backend (merged)"
          test -f artifacts/coverage-merged/Cobertura.xml

      - name: Upload test results (TRX)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-trx-results
          path: asblock-backend/artifacts/test-results/**/*.trx
          if-no-files-found: warn

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-coverage
          path: |
            asblock-backend/artifacts/test-results/**/coverage.cobertura.xml
            asblock-backend/artifacts/coverage-merged/**
          if-no-files-found: warn

      # Summary/comment only after every test project succeeded and merge produced a single report.
      - name: Code Coverage Summary Report
        if: success()
        uses: irongut/CodeCoverageSummary@51cc3a756ddcd398d447c044c02cb6aa83fdae95 # v1.3.0
        with:
          filename: "asblock-backend/artifacts/coverage-merged/Cobertura.xml"
          badge: true
          fail_below_min: true
          format: markdown
          output: both
          thresholds: "55 70"

      - name: Upload PR coverage comment artifact
        if: success() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-coverage-comment
          path: code-coverage-results.md
          if-no-files-found: error
          retention-days: 1

  coverage-comment:
    name: PR Coverage Comment
    needs: test
    if: success() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Download PR coverage comment artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: backend-coverage-comment

      - name: Add PR Coverage Comment
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          recreate: true
          path: code-coverage-results.md
