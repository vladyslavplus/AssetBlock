name: Backend CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('asblock-backend/**/*.csproj', 'asblock-backend/Directory.Packages.props', 'asblock-backend/NuGet.config', 'asblock-backend/**/packages.lock.json', 'asblock-backend/global.json') }}
          restore-keys: nuget-

      - name: Restore
        working-directory: asblock-backend
        run: dotnet restore asblock-backend.slnx

      - name: Build
        working-directory: asblock-backend
        run: dotnet build asblock-backend.slnx --no-restore --configuration Release

      - name: Test & Collect Coverage
        working-directory: asblock-backend
        run: |
          mkdir -p artifacts/test-results
          # Unique TRX name per test project avoids collisions under a shared results directory.
          for csproj in \
            AssetBlock.Application.Tests/AssetBlock.Application.Tests.csproj \
            AssetBlock.Infrastructure.Tests/AssetBlock.Infrastructure.Tests.csproj \
            AssetBlock.Infrastructure.IntegrationTests/AssetBlock.Infrastructure.IntegrationTests.csproj \
            AssetBlock.WebApi.Tests/AssetBlock.WebApi.Tests.csproj \
            AssetBlock.WebApi.IntegrationTests/AssetBlock.WebApi.IntegrationTests.csproj
          do
            name="$(basename "$csproj" .csproj)"
            echo "::group::Test $name"
            dotnet test "$csproj" \
              --no-build \
              --configuration Release \
              --logger "console;verbosity=normal" \
              --logger "trx;LogFileName=${name}.trx" \
              --results-directory "${GITHUB_WORKSPACE}/asblock-backend/artifacts/test-results/${name}" \
              --collect:"XPlat Code Coverage"
            echo "::endgroup::"
          done

      - name: Upload test results (TRX)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-trx-results
          path: asblock-backend/artifacts/test-results/**/*.trx
          if-no-files-found: warn

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: asblock-backend/artifacts/test-results/**/coverage.cobertura.xml
          if-no-files-found: warn

      - name: Code Coverage Summary Report
        if: success()
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: "asblock-backend/artifacts/test-results/**/coverage.cobertura.xml"
          badge: true
          format: markdown
          output: both

      - name: Add PR Coverage Comment
        if: success() && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          recreate: true
          path: code-coverage-results.md
