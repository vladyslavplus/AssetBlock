name: Dependency Governance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dependency-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Licenses, vulns, notices
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.x"

      - name: Install pnpm
        run: npm install -g pnpm@11.13.0

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml', 'asblock-frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('asblock-backend/**/*.csproj', 'asblock-backend/Directory.Build.props', 'asblock-backend/Directory.Packages.props', 'asblock-backend/NuGet.config', 'asblock-backend/**/packages.lock.json', 'asblock-backend/global.json', 'asblock-backend/.config/dotnet-tools.json') }}
          restore-keys: nuget-

      - name: Install root tooling
        run: pnpm install --frozen-lockfile

      - name: Restore frontend dependencies
        working-directory: asblock-frontend
        run: pnpm install --frozen-lockfile

      - name: Restore backend
        working-directory: asblock-backend
        run: |
          dotnet restore asblock-backend.slnx --locked-mode
          dotnet tool restore

      - name: Dependency governance unit tests
        run: pnpm deps:test

      - name: Dependency governance check
        run: pnpm deps:check

      - name: Upload CycloneDX SBOMs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cyclonedx-sboms
          path: artifacts/sbom/
          if-no-files-found: warn

      - name: Upload notices diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-governance-diagnostics
          path: artifacts/dependency-governance/
          if-no-files-found: ignore
