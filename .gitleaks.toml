# Gitleaks configuration for AssetBlock.
# Prefer fixing fixtures over broad allowlists. Only exact synthetic values may be listed.

title = "AssetBlock gitleaks"

[extend]
useDefault = true

# Public Ollama model digest used as MODEL_KEY fixture (canonical appsettings Digest), not a credential.
# Narrow rule+file+exact-value allowlist; does not suppress other generic-api-key findings.
[[rules]]
id = "generic-api-key"

    [[rules.allowlists]]
    description = "Synthetic nonfunctional token used to assert audit logs do not leak test input"
    condition = "AND"
    regexTarget = "secret"
    paths = ['''(^|/)asblock-backend/AssetBlock\.Infrastructure\.Tests/Services/AuditWriterTests\.cs$''']
    regexes = ['''^eyJhbGciOiJIUzI1NiJ9\.sentinel$''']

    [[rules.allowlists]]
    description = "Public tokenizer file SHA-256 values bound to the pinned UniXcoder revision, not credentials"
    condition = "AND"
    regexTarget = "secret"
    paths = ['''(^|/)scripts/feasibility_pilot/config/model-trusted-identity\.json$''']
    regexes = [
      '''^44b6e7a4fd703a619b6f8c297a8799f71ac14fdcb7f2d1ad8d8211649abed5e4$''',
      '''^c611b1f7d416eb001ee4f293d903ea8c88e703463f1d403f1866a0352743fd00$'''
    ]

    [[rules.allowlists]]
    description = "Confirmed false positive: embeddinggemma model digest fixture in BoundedQueryVectorCacheTests"
    condition = "AND"
    paths = [
      '''asblock-backend/AssetBlock\.Infrastructure\.Tests/Services/BoundedQueryVectorCacheTests\.cs'''
    ]
    regexes = [
      '''e84a7acc23943b7a589852cf6da122f0b925631b7884f297a001303dff54ffe6'''
    ]

[allowlist]
description = "Test fixtures"
regexes = [
  "test_signing_secret_at_least_32_chars",
  '''eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.eyJzdWIiOiIxMjM0NTY3ODkwIn0\.dozjgNryP4J3jVmNHl0w5N_XgL0n3I9PlFUP0THsR8U'''
]
